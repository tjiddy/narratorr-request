name: CI
run-name: CI for ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege default for the whole workflow — verify only needs to read the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Pin CI to the engines floor (package.json `>=24.10`) so verify proves the floor
          # actually runs; the Docker build tracks the 24 tip separately (docker.yml).
          # Quoted on purpose: a bare 24.10 is YAML-float-coerced to "24.1" (the setup-python
          # `3.10` gotcha) and would silently install Node 24.1.x — below the floor.
          node-version: '24.10'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint + test + typecheck + build)
        run: pnpm verify
